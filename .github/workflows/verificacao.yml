name: Verificação EDA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-de-teste
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
