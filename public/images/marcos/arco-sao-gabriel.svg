<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ERN_MARCO_ARCO_SAO_GABRIEL_V1: arco com flecha, referência de São Gabriel da Cachoeira -->
  <defs>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58a46"/>
      <stop offset=".5" stop-color="#8a5523"/>
      <stop offset="1" stop-color="#c58a46"/>
    </linearGradient>
    <linearGradient id="ponta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7d595"/>
      <stop offset="1" stop-color="#e3a144"/>
    </linearGradient>
  </defs>
  <!-- madeira do arco -->
  <path d="M20 4 C 40 12, 40 36, 20 44" fill="none" stroke="#3b230d" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M20 4 C 40 12, 40 36, 20 44" fill="none" stroke="url(#madeira)" stroke-width="4.4" stroke-linecap="round"/>
  <!-- amarrações -->
  <path d="M31.5 21.5h3.6M31.5 26.5h3.6" stroke="#e3a144" stroke-width="1.6" stroke-linecap="round"/>
  <!-- corda puxada -->
  <polyline points="20,4 13,24 20,44" fill="none" stroke="#f5f3ea" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- flecha -->
  <line x1="12" y1="24" x2="53" y2="24" stroke="#2a1a0b" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="12" y1="24" x2="53" y2="24" stroke="#f0dfb8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M51 18.5 L62 24 L51 29.5 Z" fill="url(#ponta)" stroke="#5a3a12" stroke-width="1"/>
  <!-- penas -->
  <path d="M15 24 L8 17.5 L11.5 24 Z" fill="#c8402f" stroke="#5a1d13" stroke-width=".8"/>
  <path d="M15 24 L8 30.5 L11.5 24 Z" fill="#2f8f5f" stroke="#123d27" stroke-width=".8"/>
  <path d="M19 24 L13 18.5 L15.5 24 Z" fill="#e3a144" stroke="#5a3a12" stroke-width=".7"/>
  <path d="M19 24 L13 29.5 L15.5 24 Z" fill="#e3a144" stroke="#5a3a12" stroke-width=".7"/>
